name: Check Generated Code

env:
  GOWORK: "off"

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install buf
        run: |
          BUF_VERSION=1.66.1
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      # 生成器全部本地安装、版本锁定，与 api/buf.gen.*.yaml 的 local 插件一一对应。
      # 不使用 BSR 远端插件，避免云端配额成为门禁的隐性依赖。
      - name: Install pinned protobuf generators
        run: ./tools/install-gen-tools.sh

      - name: Generate code
        run: make gen

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code api/gen || (
            echo "❌ Generated code is out of date!"
            echo "Please run 'make gen' and commit the changes."
            exit 1
          )
