name: Quality Checks

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"
  BUF_VERSION: "1.66.1"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOVULNCHECK_VERSION: "v1.2.0"

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run Go lint
        run: make lint-go

  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify published Genesis module identity
        run: |
          go mod verify
          test "$(go list -m -f '{{.Version}} {{.Sum}} {{.GoModSum}}' github.com/ceyewan/genesis)" = "v1.0.0-rc.1 h1:X3VK5VpPxIrgyzQsPPPSHQHaiNvMhhT/wcGCWkuFS8U= h1:VUPsG33Toz8lKJk2tEkgeWd7SFMIDjYtwvzYOuQmRU4="

      # repo/ 层测试依赖 testcontainers 自动拉起 postgres/redis 镜像，
      # ubuntu-latest runner 自带 Docker daemon，无需额外 services。
      - name: Run Go tests
        run: make test-go

      - name: Run full Go race suite
        run: go test -race -count=1 ./...

      - name: Run Agent multi-tenant isolation race gate
        run: go test -race ./pilot/isolation -run '^TestConcurrentTenantIsolation$' -count=5

  go-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run Go vulnerability scan
        run: make lint-security

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${{ env.BUF_VERSION }}/buf-$(uname -s)-$(uname -m)" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Run proto lint
        run: make lint-proto

  docs-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install tooling dependencies
        run: cd tools && npm ci

      - name: Run prettier check
        run: make lint-prettier

      - name: Run markdown lint
        run: make lint-markdown

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Run web lint
        run: make lint-web

      - name: Run web build
        run: cd web && npm run build

  pilot-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pilot/bridge/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install pinned Bridge and Pi dependencies
        run: cd pilot/bridge && npm ci

      - name: Type-check trusted Bridge
        run: cd pilot/bridge && npm run typecheck

      - name: Test trusted Bridge
        run: cd pilot/bridge && npm test

      - name: Test pinned Pi RPC contract offline
        env:
          RESONANCE_PI_BINARY: ${{ github.workspace }}/pilot/bridge/node_modules/.bin/pi
          RESONANCE_PI_EXPECTED_VERSION: "0.84.1"
          RESONANCE_PI_BRIDGE: ${{ github.workspace }}/pilot/bridge/src/index.ts
        run: go test -tags=pi_contract ./pilot/runtime/pi -run TestRealPiRPCContract -count=1 -v

  pilot-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Pilot control and pinned Runtime images
        run: |
          docker build --target final -t resonance:ci -f deploy/Dockerfile .
          docker build --target pilot-control-final -t resonance-pilot:ci -f deploy/Dockerfile .
          docker build --target pilot-runtime-final -t resonance-pilot-runtime:ci -f deploy/Dockerfile .

      - name: Verify control image excludes Node and Runtime pins Pi
        run: |
          test "$(docker image inspect resonance:ci --format '{{.Config.User}}')" = "nobody"
          test "$(docker image inspect resonance-pilot:ci --format '{{.Config.User}}')" = "resonance"
          docker run --rm --entrypoint /bin/sh resonance-pilot:ci -ec '! command -v node && ! test -e /opt/resonance/bridge/node_modules/.bin/pi'
          test "$(docker image inspect resonance-pilot-runtime:ci --format '{{.Config.User}}')" = "resonance"
          test "$(docker run --rm --entrypoint /opt/resonance/bridge/node_modules/.bin/pi resonance-pilot-runtime:ci --version)" = "0.84.1"

      - name: Verify fail-closed Agent rollback inputs
        run: |
          PILOT_PREVIOUS_IMAGE_DIGEST="registry.example/resonance-pilot@sha256:$(printf 'a%.0s' {1..64})" \
          PILOT_RUNTIME_PREVIOUS_IMAGE_DIGEST="registry.example/resonance-pilot-runtime@sha256:$(printf 'b%.0s' {1..64})" \
            ./deploy/scripts/rollback-agent.sh --validate-only
          if PILOT_PREVIOUS_IMAGE_DIGEST="registry.example/resonance-pilot:latest" \
             PILOT_RUNTIME_PREVIOUS_IMAGE_DIGEST="registry.example/resonance-pilot-runtime@sha256:$(printf 'b%.0s' {1..64})" \
               ./deploy/scripts/rollback-agent.sh --validate-only; then
            echo "rollback validation accepted a mutable tag" >&2
            exit 1
          fi
