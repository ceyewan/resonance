name: Quality Checks

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GO_VERSION: "1.26.10"
  NODE_VERSION: "22"
  BUF_VERSION: "1.66.1"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOVULNCHECK_VERSION: "v1.2.0"

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run Go lint
        run: make lint-go

  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify published Genesis module identity
        run: |
          go mod verify
          test "$(go list -m -f '{{.Version}} {{.Sum}} {{.GoModSum}}' github.com/ceyewan/genesis)" = "v1.0.0 h1:cVQ98tl3usO/3UcHQKVk/c3W8PvamuMnac91tmaqRRw= h1:2ocd7qesFJ7ElFEvJXQHHCRwdNR4MPm2xHSBITB+Y8E="

      # repo/ 层测试依赖 testcontainers 自动拉起 postgres/redis 镜像，
      # ubuntu-latest runner 自带 Docker daemon，无需额外 services。
      - name: Run Go tests
        run: make test-go

      - name: Run full Go race suite
        run: go test -race -count=1 ./...

  go-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install evidence scanner dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Test evidence scanner fail-closed behavior
        run: ./deploy/scripts/test-evidence-secret-scan.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run Go vulnerability scan
        run: make lint-security

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${{ env.BUF_VERSION }}/buf-$(uname -s)-$(uname -m)" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Run proto lint
        run: make lint-proto

  docs-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install tooling dependencies
        run: cd tools && npm ci

      - name: Run prettier check
        run: make lint-prettier

      - name: Run markdown lint
        run: make lint-markdown

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Run web lint
        run: make lint-web

      - name: Run web build
        run: cd web && npm run build

  pilot-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pilot/bridge/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install pinned Bridge and Pi dependencies
        run: cd pilot/bridge && npm ci

      - name: Type-check trusted Bridge
        run: cd pilot/bridge && npm run typecheck

      - name: Test trusted Bridge
        run: cd pilot/bridge && npm test

      - name: Test pinned Pi RPC contract offline
        env:
          RESONANCE_PI_BINARY: ${{ github.workspace }}/pilot/bridge/node_modules/.bin/pi
          RESONANCE_PI_EXPECTED_VERSION: "0.84.1"
          RESONANCE_PI_BRIDGE: ${{ github.workspace }}/pilot/bridge/src/index.ts
        run: go test -tags=pi_contract ./pilot/runtime/pi -run TestRealPiRPCContract -count=1 -v

  pilot-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build IM and Pilot images
        run: |
          docker build --target final -t resonance:ci -f deploy/Dockerfile .
          docker build --target pilot-final -t resonance-pilot:ci -f deploy/Dockerfile .

      - name: Verify non-root user and pinned Pi
        run: |
          test "$(docker image inspect resonance-pilot:ci --format '{{.Config.User}}')" = "resonance"
          test "$(docker run --rm --entrypoint /opt/resonance/bridge/node_modules/.bin/pi resonance-pilot:ci --version)" = "0.84.1"
