name: Deploy Resonance
on:
  push:
    tags: ["v*"]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ceyewan/resonance
          tags: type=ref,event=tag
      - uses: docker/metadata-action@v5
        id: meta-pilot
        with:
          images: ceyewan/resonance-pilot
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          target: final
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=im
          cache-to: type=gha,mode=max,scope=im
      - uses: docker/build-push-action@v5
        id: pilot
        with:
          context: .
          file: deploy/Dockerfile
          target: pilot-final
          push: true
          tags: ${{ steps.meta-pilot.outputs.tags }}
          cache-from: type=gha,scope=pilot
          cache-to: type=gha,mode=max,scope=pilot
          provenance: mode=max
          sbom: true
      - name: Record pinned Pilot release
        env:
          DIGEST: ${{ steps.pilot.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'RESONANCE_PILOT_IMAGE=ceyewan/resonance-pilot@%s\n' "$DIGEST" > agent-release.env
      - uses: actions/upload-artifact@v4
        with:
          name: agent-release-${{ github.ref_name }}
          path: agent-release.env
          if-no-files-found: error
