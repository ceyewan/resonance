# Resonance Prettier 配置
# 适用：ts/tsx/js/json/yaml/css 等由 prettier 支持的文件
# Markdown 由 markdownlint-cli2 接管（见 .markdownlint-cli2.yaml），在 .prettierignore 中排除
printWidth: 100
tabWidth: 2
useTabs: false
semi: true
singleQuote: false
trailingComma: all
bracketSpacing: true
arrowParens: always
endOfLine: lf
