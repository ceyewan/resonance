version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck # 检查未处理的错误
    - govet # Go 官方静态分析工具
    - ineffassign # 检查无效赋值
    - staticcheck # 包含原 gosimple 检查
    - unused # 检查未使用的常量、变量、函数和类型
    - misspell # 检查拼写错误
    - unconvert # 检查不必要的类型转换
    - unparam # 检查未使用的函数参数 (正是你刚才发现的问题)
  exclusions:
    generated: lax
    paths:
      - docs
      - deploy
    rules:
      - path: _test\.go
        linters:
          - errcheck # 测试代码中忽略一些错误检查通常是可以接受的
          - unparam # 固定夹具参数可以让安全边界测试保持自解释

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/ceyewan/resonance
  exclusions:
    generated: lax
    paths:
      - docs
      - deploy
