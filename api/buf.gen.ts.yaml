version: v2

# 管理选项（TS 通常不需要像 Go 那样 managed 选项）
managed:
  enabled: true

plugins:
  # TypeScript 消息 + Service 定义生成器 (Protobuf-ES v2)
  # 锁定 v2.11.0 以匹配 web/package.json 中的 @bufbuild/protobuf ^2.11.0
  #
  # Connect-ES v2 起不再需要独立的 connectrpc/es 插件：
  # bufbuild/es v2 会一并生成 message / enum / service definitions，
  # Connect-Web v2 运行时直接消费 *_pb.ts 即可。
  - remote: buf.build/bufbuild/es:v2.11.0
    out: gen/ts
    opt: target=ts
