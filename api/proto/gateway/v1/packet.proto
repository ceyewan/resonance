syntax = "proto3";

package resonance.gateway.v1;

import "common/v1/event.proto";
import "common/v1/message.proto";

option go_package = "github.com/ceyewan/resonance/api/gen/go/gateway/v1;gatewayv1";

message WsPacket {
  string client_seq = 1;

  oneof payload {
    Pulse pulse = 10;
    Ack ack = 11;
    ChatRequest chat_request = 20;
    resonance.common.v1.ChatEvent event = 30;
    StreamBegin stream_begin = 40;
    StreamChunk stream_chunk = 41;
    StreamEnd stream_end = 42;
    TypingSignal typing = 43;
  }
}

message Pulse {}

message Ack {
  string ref_client_seq = 1;
  int64 event_id = 2;
  int64 seq_id = 3;
  string session_id = 4;
}

message ChatRequest {
  string session_id = 1;
  resonance.common.v1.Message message = 2;
  resonance.common.v1.MessageRecall recall = 3;
  resonance.common.v1.MessageEdit edit = 4;
}

message StreamBegin {
  // Deprecated: source_event_id/run_id are the authoritative correlation keys.
  int64 parent_event_id = 1 [deprecated = true];
  string session_id = 2;
  string from_username = 3;
  string run_id = 4;
  string stream_id = 5;
  int64 source_event_id = 6;
  string final_client_msg_id = 7;
}

message StreamChunk {
  // Deprecated: retained for wire compatibility with older clients.
  int64 parent_event_id = 1 [deprecated = true];
  int32 sequence = 2 [deprecated = true];
  string delta = 3;
  string run_id = 4;
  string stream_id = 5;
  uint64 stream_sequence = 6;
  string session_id = 7;
}

message StreamEnd {
  // Deprecated: retained for wire compatibility with older clients.
  int64 parent_event_id = 1 [deprecated = true];
  StreamFinishReason reason = 2;
  string run_id = 3;
  string stream_id = 4;
  uint64 stream_sequence = 5;
  string session_id = 6;
  string final_client_msg_id = 7;
}

enum StreamFinishReason {
  STREAM_FINISH_REASON_UNSPECIFIED = 0;
  STREAM_FINISH_REASON_STOP = 1;
  STREAM_FINISH_REASON_LENGTH = 2;
  STREAM_FINISH_REASON_TOOL_CALL = 3;
  STREAM_FINISH_REASON_ERROR = 4;
}

message TypingSignal {
  string session_id = 1;
  string from_username = 2;
  bool is_typing = 3;
}
