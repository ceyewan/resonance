# ============================================================================
# Task 服务配置（本地直接运行）
# 用途：make dev - 本地直接运行 Go 程序，连接 127.0.0.1
# ============================================================================

service:
  name: task-service

log:
  level: debug
  format: console # 开发环境使用 console 格式，方便调试
  output: stdout

postgres:
  name: task-postgres
  host: 127.0.0.1
  port: 5432
  username: resonance
  password: "" # 从环境变量 RESONANCE_POSTGRES_PASSWORD 读取
  database: resonance
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 20
  conn_max_lifetime: 1h

redis:
  name: task-redis
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 10

nats:
  name: task-nats
  url: nats://127.0.0.1:4222
  max_reconnect: 10
  reconnect_delay: 1s

etcd:
  name: task-etcd
  endpoints:
    - 127.0.0.1:2379
  dial_timeout: 5s
  username: ""
  password: ""

registry:
  namespace: /resonance/services
  default_ttl: 30s
  enable_cache: true
  cache_expiration: 10s
  poll_interval: 10s # 服务发现轮询间隔

gateway_service_name: gateway-service
gateway_queue_size: 1000 # 每个 Gateway 的推送队列大小
gateway_pusher_count: 3 # 每个 Gateway 的并发推送协程数

# 单消费者配置（先存储后推送）
consumer:
  topic: resonance.chat.event.v1
  queue_group: resonance_group_chat_event
  worker_count: 20
  max_retry: 3
  retry_interval: 5

# Agent delta 是临时 UI 通道；此消费者只路由到 Gateway，不写 Inbox。
stream_consumer:
  topic: resonance.agent.stream.v1
  queue_group: resonance_group_agent_stream
  worker_count: 10
  max_retry: 2
  retry_interval: 0
  dlq_topic: resonance.agent.stream.v1.dlq

stream_max_delta_bytes: 65536
