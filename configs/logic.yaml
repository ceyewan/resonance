# ============================================================================
# Logic 服务配置（本地直接运行）
# 用途：make dev - 本地直接运行 Go 程序，连接 127.0.0.1
# ============================================================================

service:
  name: logic-service
  host: localhost
  server_addr: :15090 # gRPC 服务地址 (5位数)

# 基础组件配置
log:
  level: debug
  format: console # 开发环境使用 console 格式，方便调试
  output: stdout

postgres:
  name: logic-postgres
  host: 127.0.0.1
  port: 5432
  username: resonance
  password: "" # 从环境变量 RESONANCE_POSTGRES_PASSWORD 读取
  database: resonance
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 20
  conn_max_lifetime: 1h

redis:
  name: logic-redis
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 10

nats:
  name: logic-nats
  url: nats://127.0.0.1:4222
  max_reconnect: 10
  reconnect_delay: 1s

etcd:
  name: logic-etcd
  endpoints:
    - 127.0.0.1:2379
  dial_timeout: 5s
  username: ""
  password: ""

# 服务注册发现配置
registry:
  namespace: /resonance/services
  default_ttl: 30s
  enable_cache: true
  cache_expiration: 10s

# 认证配置
auth:
  secret_key: "" # 从环境变量 RESONANCE_AUTH_SECRET_KEY 读取（生产环境必须设置）
  issuer: resonance-service
  access_token_ttl: 24h

# 管理员初始化配置
admin:
  username: ceyewan
  password: "" # 从环境变量 RESONANCE_ADMIN_PASSWORD 读取
  nickname: 管理员

agent_bot:
  username: resonance-agent
  nickname: Resonance Assistant

# Init 只在策略不存在时创建这组 fail-closed 预算；后续变更必须通过
# expected-version CAS 的受控管理路径，重启不会覆盖生产限额。
agent_budget:
  tenant_id: default
  enabled: true
  daily_token_limit: 2000000
  monthly_token_limit: 20000000
  daily_cost_limit_micros: 50000000
  monthly_cost_limit_micros: 500000000
  max_attempt_tokens: 65536
  max_attempt_cost_micros: 10000000

# Logic owns the profile IDs and pinned versions written into AI sessions.
# Clients may select only the corresponding enum; they cannot supply tenant,
# bot username or version.
agent_sessions:
  user_assistant_profile_version: 1
  iam_admin_profile_version: 1

service_auth:
  pilot_service_id: pilot-service
  pilot_secret: "" # 从环境变量 RESONANCE_SERVICE_AUTH_PILOT_SECRET 读取，生产至少 32 字节
  pilot_tenant_id: default
  iam_pilot_service_id: pilot-iam-admin-service
  iam_pilot_secret: "" # 独立于普通 Pilot；未配置时 iam-admin Pilot fail closed
  iam_pilot_tenant_id: default
  gateway_service_id: gateway-service
  gateway_secret: "" # 与 Gateway 的 RESONANCE_SERVICE_AUTH_GATEWAY_SECRET 一致
  max_skew: 30s
  nonce_key_prefix: "resonance:logic:serviceauth:nonce:"

# ID 生成器配置 (对齐 Gateway 分桶分发机制)
worker_id:
  max_id: 1024
  key: resonance:logic:worker

# 可观测性配置
observability:
  trace:
    disable: false # 开发环境启用 Trace
    endpoint: localhost:4317 # OTLP Collector 地址
    insecure: true # 开发环境使用不安全连接
    sampler: 1.0 # 开发环境 100% 采样
  metrics:
    port: 9091 # Prometheus 端口
    path: /metrics # Metrics 路径
    enable_runtime: true # 启用运行时指标

# Outbox Job 配置
outbox:
  batch_size: 100 # 每次处理的消息批次大小
  max_retries: 5 # 最大重试次数
  ticker_time: 1s # 扫描间隔
  worker_count: 5 # 并发处理的 Worker 数量

# Agent Approval 只管理审批事实；IAM scope 由权威授权源校验。
agent_approval:
  read_scope: agent:approval:read
  decide_scope: agent:approval:decide
  allow_self_approve: false
