      retries: 5
      start_period: 20s
    image: ceyewan/resonance-pilot:local
    init: true
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    mem_limit: "2147483648"
    networks:
      resonance-net: null
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m0s
    tmpfs:
      - /tmp:size=128m,mode=1777,nodev,nosuid
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/configs
        target: /app/configs
        read_only: true
        bind: {}
      - type: volume
        source: pilot-iam-admin-data
        target: /var/lib/resonance-pilot
