      RESONANCE_DEBUG_CONFIG: "false"
    hostname: pilot-iam-admin-runtime-001
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:15095/ready
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 20s
    image: ceyewan/resonance-pilot-runtime:local
    init: true
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
