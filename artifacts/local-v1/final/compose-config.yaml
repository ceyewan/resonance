    networks:
      runtime-internal: null
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=128m,mode=1777,nodev,nosuid
      - /home/resonance:size=16m,mode=0700,uid=10001,gid=10001,nodev,nosuid
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/configs
        target: /app/configs
        read_only: true
        bind: {}
      - type: volume
        source: pilot-iam-admin-data
        target: /var/lib/resonance-pilot
        volume: {}
      - type: volume
        source: pilot-iam-admin-sockets
        target: /run/resonance-agent
        volume: {}
  pilot-runtime:
    build:
      context: /Users/ceyewan/CodeField/resonance
      dockerfile: deploy/Dockerfile
      target: pilot-runtime-final
    cap_drop:
