name: resonance-v1
services:
  alloy:
    cpus: 1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
        required: true
      tempo:
        condition: service_healthy
        required: true
    healthcheck:
      test:
        - CMD
        - /bin/alloy
        - --version
      timeout: 5s
      interval: 15s
      retries: 5
    image: grafana/alloy:v1.8.2
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    mem_limit: "536870912"
    networks:
      resonance-net: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/deploy/observability/alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
        bind: {}
      - type: volume
        source: alloy-data
        target: /var/lib/alloy
        volume: {}
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {}
  cadvisor:
    cpus: 0.75
    devices:
      - source: /dev/kmsg
        target: /dev/kmsg
        permissions: rwm
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/healthz
      timeout: 5s
      interval: 15s
      retries: 5
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    mem_limit: "402653184"
    networks:
      resonance-net: null
    privileged: true
    restart: unless-stopped
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind: {}
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
        bind: {}
      - type: bind
        source: /sys
        target: /sys
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
        bind: {}
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
        bind: {}
  etcd:
    cpus: 1
    environment:
      ETCD_ADVERTISE_CLIENT_URLS: http://resonance-etcd:2379
      ETCD_AUTO_COMPACTION_RETENTION: "1"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: ""
      ETCD_INITIAL_CLUSTER: ""
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: ""
      ETCD_NAME: resonance-etcd
      ETCD_QUOTA_BACKEND_BYTES: "1073741824"
      ETCD_SNAPSHOT_COUNT: "5000"
      ETCDCTL_API: "3"
    hostname: resonance-etcd
    healthcheck:
      test:
        - CMD
        - etcdctl
        - endpoint
        - health
      timeout: 3s
      interval: 10s
      retries: 3
      start_period: 10s
    image: quay.io/coreos/etcd:v3.5.12
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    mem_limit: "536870912"
    networks:
      resonance-net: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: etcd-data
        target: /etcd-data
        volume: {}
  gateway:
    build:
      context: /Users/ceyewan/CodeField/resonance
      dockerfile: deploy/Dockerfile
      target: final
    cpus: 1.5
    command:
      - -module
      - gateway
    depends_on:
      etcd:
        condition: service_healthy
        required: true
      logic:
        condition: service_healthy
        required: true
      nats:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      HOSTNAME: gateway-service-001
      RESONANCE_AUTH_ACCESS_TOKEN_TTL: 24h
      RESONANCE_AUTH_ISSUER: resonance-service
      RESONANCE_AUTH_SECRET_KEY: <redacted>
      RESONANCE_DEBUG_CONFIG: "false"
      RESONANCE_ETCD_ENDPOINTS: etcd:2379
      RESONANCE_LOG_FORMAT: json
      RESONANCE_LOG_OUTPUT: stdout
      RESONANCE_OBSERVABILITY_ENVIRONMENT: local-v1
      RESONANCE_OBSERVABILITY_TRACE_DISABLE: "false"
      RESONANCE_OBSERVABILITY_TRACE_ENDPOINT: alloy:4317
      RESONANCE_OBSERVABILITY_TRACE_INSECURE: "true"
      RESONANCE_OBSERVABILITY_TRACE_SAMPLER: "1"
      RESONANCE_OBSERVABILITY_VERSION: 69f02a11319e
      RESONANCE_RATE_LIMIT_DRIVER: distributed
      RESONANCE_RATE_LIMIT_PREFIX: "resonance:gateway:ratelimit:"
      RESONANCE_REDIS_ADDR: redis:6379
      RESONANCE_SERVICE_AUTH_GATEWAY_SECRET: <redacted>
      RESONANCE_SERVICE_HOST: gateway-service-001
    hostname: gateway-service-001
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:8080/health
      timeout: 3s
      interval: 10s
      retries: 6
      start_period: 15s
    image: ceyewan/resonance:local
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: "805306368"
    networks:
      resonance-net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "18080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/configs
        target: /app/configs
        read_only: true
        bind: {}
  grafana:
    cpus: 1
    depends_on:
      loki:
        condition: service_healthy
        required: true
      prometheus:
        condition: service_healthy
        required: true
      tempo:
        condition: service_healthy
        required: true
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: <redacted>
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:3000/api/health
      timeout: 3s
      interval: 10s
      retries: 8
      start_period: 15s
    image: grafana/grafana:11.6.0
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    mem_limit: "536870912"
    networks:
      resonance-net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3000
        published: "13000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/deploy/observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind: {}
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/deploy/observability/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind: {}
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
        volume: {}
  init:
    build:
      context: /Users/ceyewan/CodeField/resonance
      dockerfile: deploy/Dockerfile
      target: final
    cpus: 1
    command:
      - -module
      - init
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      RESONANCE_ADMIN_NICKNAME: 管理员
      RESONANCE_ADMIN_PASSWORD: <redacted>
      RESONANCE_ADMIN_USERNAME: ceyewan
      RESONANCE_AGENT_BUDGET_DAILY_COST_LIMIT_MICROS: "50000000"
      RESONANCE_AGENT_BUDGET_DAILY_TOKEN_LIMIT: "2000000"
      RESONANCE_AGENT_BUDGET_ENABLED: "true"
      RESONANCE_AGENT_BUDGET_MAX_ATTEMPT_COST_MICROS: "10000000"
      RESONANCE_AGENT_BUDGET_MAX_ATTEMPT_TOKENS: "65536"
      RESONANCE_AGENT_BUDGET_MONTHLY_COST_LIMIT_MICROS: "500000000"
      RESONANCE_AGENT_BUDGET_MONTHLY_TOKEN_LIMIT: "20000000"
      RESONANCE_AGENT_BUDGET_TENANT_ID: default
      RESONANCE_DEBUG_CONFIG: "false"
      RESONANCE_POSTGRES_HOST: postgres
      RESONANCE_POSTGRES_PASSWORD: <redacted>
    image: ceyewan/resonance:local
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    mem_limit: "536870912"
    networks:
      resonance-net: null
    restart: "no"
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/configs
        target: /app/configs
        read_only: true
        bind: {}
  logic:
    build:
      context: /Users/ceyewan/CodeField/resonance
      dockerfile: deploy/Dockerfile
      target: final
    cpus: 1.5
    command:
      - -module
      - logic
    depends_on:
      etcd:
        condition: service_healthy
        required: true
      init:
        condition: service_completed_successfully
        required: true
      nats:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      HOSTNAME: logic-service-001
      RESONANCE_AGENT_SESSIONS_IAM_ADMIN_PROFILE_VERSION: "1"
      RESONANCE_AGENT_SESSIONS_USER_ASSISTANT_PROFILE_VERSION: "1"
      RESONANCE_AUTH_ACCESS_TOKEN_TTL: 24h
      RESONANCE_AUTH_ISSUER: resonance-service
      RESONANCE_AUTH_SECRET_KEY: <redacted>
      RESONANCE_DEBUG_CONFIG: "false"
      RESONANCE_ETCD_ENDPOINTS: etcd:2379
      RESONANCE_LOG_FORMAT: json
      RESONANCE_LOG_OUTPUT: stdout
      RESONANCE_NATS_URL: nats://nats:4222
      RESONANCE_OBSERVABILITY_ENVIRONMENT: local-v1
      RESONANCE_OBSERVABILITY_TRACE_DISABLE: "false"
      RESONANCE_OBSERVABILITY_TRACE_ENDPOINT: alloy:4317
      RESONANCE_OBSERVABILITY_TRACE_INSECURE: "true"
      RESONANCE_OBSERVABILITY_TRACE_SAMPLER: "1"
      RESONANCE_OBSERVABILITY_VERSION: 69f02a11319e
      RESONANCE_POSTGRES_HOST: postgres
      RESONANCE_POSTGRES_PASSWORD: <redacted>
      RESONANCE_REDIS_ADDR: redis:6379
      RESONANCE_SERVICE_AUTH_GATEWAY_SECRET: <redacted>
      RESONANCE_SERVICE_AUTH_IAM_PILOT_SECRET: <redacted>
      RESONANCE_SERVICE_AUTH_IAM_PILOT_SERVICE_ID: pilot-iam-admin-service
      RESONANCE_SERVICE_AUTH_IAM_PILOT_TENANT_ID: default
      RESONANCE_SERVICE_AUTH_PILOT_SECRET: <redacted>
      RESONANCE_SERVICE_AUTH_PILOT_SERVICE_ID: pilot-service
      RESONANCE_SERVICE_AUTH_PILOT_TENANT_ID: default
      RESONANCE_SERVICE_HOST: logic-service-001
    hostname: logic-service-001
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:15091/ready
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 10s
    image: ceyewan/resonance:local
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: "805306368"
    networks:
      resonance-net: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/configs
        target: /app/configs
        read_only: true
        bind: {}
  loki:
    cpus: 1
    command:
      - -config.file=/etc/loki/config.yml
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -version
      timeout: 5s
      interval: 15s
      retries: 5
    image: grafana/loki:3.4.2
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    mem_limit: "805306368"
    networks:
      resonance-net: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/deploy/observability/loki/config.yml
        target: /etc/loki/config.yml
        read_only: true
        bind: {}
      - type: volume
        source: loki-data
        target: /loki
        volume: {}
  nats:
    cpus: 1
    command:
      - --name=resonance-nats
      - --http_port=8222
      - --js
      - --sd=/data
    hostname: resonance-nats
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8222/healthz
      timeout: 5s
      interval: 15s
      retries: 3
      start_period: 10s
    image: nats:2.10-alpine
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 5m
    mem_limit: "536870912"
    networks:
      resonance-net: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: nats-data
        target: /data
        volume: {}
  pilot:
    build:
      context: /Users/ceyewan/CodeField/resonance
      dockerfile: deploy/Dockerfile
      target: pilot-control-final
    cap_drop:
      - ALL
    cpus: 2
    command:
      - -module
      - pilot
    depends_on:
      etcd:
        condition: service_healthy
        required: true
      init:
        condition: service_completed_successfully
        required: true
      logic:
        condition: service_healthy
        required: true
      nats:
        condition: service_healthy
        required: true
      pilot-runtime:
        condition: service_healthy
        required: true
      pilot-storage-init:
        condition: service_completed_successfully
        required: true
      postgres:
        condition: service_healthy
        required: true
    environment:
      HOSTNAME: pilot-service-001
      RESONANCE_BROKER_ADDRESS: unix:///run/resonance-agent/broker.sock
      RESONANCE_BROKER_CAPABILITY_SECRET: <redacted>
      RESONANCE_DEBUG_CONFIG: "false"
      RESONANCE_ETCD_ENDPOINTS: etcd:2379
      RESONANCE_LOG_FORMAT: json
      RESONANCE_LOG_OUTPUT: stdout
      RESONANCE_NATS_URL: nats://nats:4222
      RESONANCE_OBSERVABILITY_ENVIRONMENT: local-v1
      RESONANCE_OBSERVABILITY_TRACE_DISABLE: "false"
      RESONANCE_OBSERVABILITY_TRACE_ENDPOINT: alloy:4317
      RESONANCE_OBSERVABILITY_TRACE_INSECURE: "true"
      RESONANCE_OBSERVABILITY_TRACE_SAMPLER: "1"
      RESONANCE_OBSERVABILITY_VERSION: 69f02a11319e
      RESONANCE_POSTGRES_HOST: postgres
      RESONANCE_POSTGRES_PASSWORD: <redacted>
      RESONANCE_PROFILE_MODEL: resonance-deterministic-v1
      RESONANCE_PROFILE_PROVIDER: dashscope
      RESONANCE_PROFILE_VERSION: "1"
      RESONANCE_RUNTIME_MODE: remote
      RESONANCE_RUNTIME_SOCKET_PATH: /run/resonance-agent/runtime.sock
      RESONANCE_SERVICE_AUTH_SECRET: <redacted>
      RESONANCE_SERVICE_AUTH_SERVICE_ID: pilot-service
      RESONANCE_TENANT_ID: default
    hostname: pilot-service-001
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:15093/ready
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 20s
    image: ceyewan/resonance-pilot:local
    init: true
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    mem_limit: "2147483648"
    networks:
      resonance-net: null
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m0s
    tmpfs:
      - /tmp:size=128m,mode=1777,nodev,nosuid
    volumes:
      - type: bind
        source: /Users/ceyewan/CodeField/resonance/configs
        target: /app/configs
        read_only: true
        bind: {}
      - type: volume
        source: pilot-data
        target: /var/lib/resonance-pilot
        volume: {}
      - type: volume
        source: pilot-sockets
        target: /run/resonance-agent
        volume: {}
  pilot-iam-admin:
    build:
      context: /Users/ceyewan/CodeField/resonance
      dockerfile: deploy/Dockerfile
      target: pilot-control-final
    cap_drop:
      - ALL
    cpus: 2
    command:
      - -module
      - pilot
    depends_on:
      etcd:
