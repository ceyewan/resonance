# IM services plus one Pilot process (Go + pinned Pi). No IAM sidecars or Tool Broker.
x-resonance-build: &resonance-build
  context: ..
  dockerfile: deploy/Dockerfile
  target: final

x-resonance-service: &resonance-service
  image: ${RESONANCE_IMAGE:-ceyewan/resonance:local}
  build: *resonance-build
  volumes:
    - ${RESONANCE_CONFIG_DIR:-../configs}:/app/configs:ro
  networks: [resonance-net]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  init:
    <<: *resonance-service
    container_name: resonance-init
    command: ["-module", "init"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESONANCE_POSTGRES_HOST: postgres
      RESONANCE_POSTGRES_PASSWORD: ${RESONANCE_POSTGRES_PASSWORD:-}
      RESONANCE_ADMIN_USERNAME: ${RESONANCE_ADMIN_USERNAME:-}
      RESONANCE_ADMIN_PASSWORD: ${RESONANCE_ADMIN_PASSWORD:-}
      RESONANCE_ADMIN_NICKNAME: ${RESONANCE_ADMIN_NICKNAME:-}
    restart: "no"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  logic:
    <<: *resonance-service
    hostname: ${RESONANCE_LOGIC_HOSTNAME:-logic-service-001}
    container_name: resonance-logic
    command: ["-module", "logic"]
    environment:
      RESONANCE_SERVICE_HOST: ${RESONANCE_LOGIC_HOSTNAME:-logic-service-001}
      RESONANCE_POSTGRES_HOST: postgres
      RESONANCE_POSTGRES_PASSWORD: ${RESONANCE_POSTGRES_PASSWORD:-}
      RESONANCE_REDIS_ADDR: redis:6379
      RESONANCE_NATS_URL: nats://nats:4222
      RESONANCE_ETCD_ENDPOINTS: etcd:2379
      RESONANCE_SERVICE_AUTH_PILOT_SERVICE_ID: ${RESONANCE_PILOT_SERVICE_AUTH_ID:-pilot-service}
      RESONANCE_SERVICE_AUTH_PILOT_SECRET: ${RESONANCE_PILOT_SERVICE_AUTH_SECRET:-}
      RESONANCE_SERVICE_AUTH_GATEWAY_SECRET: ${RESONANCE_GATEWAY_SERVICE_AUTH_SECRET:-}
      RESONANCE_AUTH_SECRET_KEY: ${RESONANCE_AUTH_SECRET_KEY:-}
      RESONANCE_AUTH_ISSUER: ${RESONANCE_AUTH_ISSUER:-resonance-service}
      RESONANCE_AUTH_ACCESS_TOKEN_TTL: ${RESONANCE_AUTH_ACCESS_TOKEN_TTL:-24h}
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:15091/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  task:
    <<: *resonance-service
    hostname: ${RESONANCE_TASK_HOSTNAME:-task-service-001}
    container_name: resonance-task
    command: ["-module", "task"]
    environment:
      RESONANCE_POSTGRES_HOST: postgres
      RESONANCE_POSTGRES_PASSWORD: ${RESONANCE_POSTGRES_PASSWORD:-}
      RESONANCE_REDIS_ADDR: redis:6379
      RESONANCE_NATS_URL: nats://nats:4222
      RESONANCE_ETCD_ENDPOINTS: etcd:2379
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      etcd:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  pilot:
    <<: *resonance-service
    image: ${RESONANCE_PILOT_IMAGE:-ceyewan/resonance-pilot:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: pilot-final
    container_name: resonance-pilot
    command: ["-module", "pilot"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${RESONANCE_PILOT_MEMORY_LIMIT:-2g}
    cpus: ${RESONANCE_PILOT_CPU_LIMIT:-2.0}
    stop_grace_period: 60s
    environment:
      RESONANCE_POSTGRES_HOST: postgres
      RESONANCE_POSTGRES_PASSWORD: ${RESONANCE_POSTGRES_PASSWORD:-}
      RESONANCE_NATS_URL: nats://nats:4222
      RESONANCE_ETCD_ENDPOINTS: etcd:2379
      RESONANCE_ASSISTANT_MODEL: ${DASHSCOPE_MODEL:-qwen3.8-max}
      RESONANCE_SERVICE_AUTH_SERVICE_ID: ${RESONANCE_PILOT_SERVICE_AUTH_ID:-pilot-service}
      RESONANCE_SERVICE_AUTH_SECRET: ${RESONANCE_PILOT_SERVICE_AUTH_SECRET:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3.8-max}
    volumes:
      - ${RESONANCE_CONFIG_DIR:-../configs}:/app/configs:ro
      - pilot-data:/var/lib/resonance-pilot
    tmpfs:
      - /tmp:size=128m,mode=1777,nodev,nosuid
    depends_on:
      logic:
        condition: service_healthy
      nats:
        condition: service_healthy
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:15093/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  gateway:
    <<: *resonance-service
    hostname: ${RESONANCE_GATEWAY_HOSTNAME:-gateway-service-001}
    container_name: resonance-gateway
    command: ["-module", "gateway"]
    environment:
      RESONANCE_SERVICE_HOST: ${RESONANCE_GATEWAY_HOSTNAME:-gateway-service-001}
      RESONANCE_REDIS_ADDR: redis:6379
      RESONANCE_RATE_LIMIT_DRIVER: distributed
      RESONANCE_RATE_LIMIT_PREFIX: "resonance:gateway:ratelimit:"
      RESONANCE_ETCD_ENDPOINTS: etcd:2379
      RESONANCE_SERVICE_AUTH_GATEWAY_SECRET: ${RESONANCE_GATEWAY_SERVICE_AUTH_SECRET:-}
      RESONANCE_AUTH_SECRET_KEY: ${RESONANCE_AUTH_SECRET_KEY:-}
      RESONANCE_AUTH_ISSUER: ${RESONANCE_AUTH_ISSUER:-resonance-service}
      RESONANCE_AUTH_ACCESS_TOKEN_TTL: ${RESONANCE_AUTH_ACCESS_TOKEN_TTL:-24h}
    depends_on:
      logic:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT_BINDING:-127.0.0.1:8080:8080}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  web:
    <<: *resonance-service
    container_name: resonance-web
    command: ["-module", "web"]
    environment:
      RESONANCE_SERVICE_HOST: 0.0.0.0
      RESONANCE_WEB_API_BASE_URL: ${RESONANCE_WEB_API_BASE_URL:-http://localhost:8080}
      RESONANCE_WEB_WS_BASE_URL: ${RESONANCE_WEB_WS_BASE_URL:-ws://localhost:8080/ws}
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "${WEB_PORT_BINDING:-127.0.0.1:4173:4173}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: resonance-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
    profiles: [production]

volumes:
  pilot-data:
