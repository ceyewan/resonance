# =============================================================================
# Resonance 生产环境覆盖配置
#
# 用法：
#   docker compose --env-file .env -p resonance \
#     -f deploy/base.yaml \
#     -f deploy/services.yaml \
#     -f deploy/services.prod.yaml \
#     --profile production up -d
#
# 目标：
#   1) gateway / web 不对宿主机暴露端口（仅通过 caddy 网络反代）
#   2) 注入 Caddy 网络和反向代理 labels
#   3) 为 web 注入运行时 API/WS 地址（可被 .env 覆盖）
# =============================================================================

services:
  provider-egress-proxy:
    environment:
      # RFC 2544 synthetic DNS compatibility is local-only. Production must
      # accept only genuinely public resolved addresses.
      RESONANCE_ALLOW_SYNTHETIC_BENCHMARK_ADDRESSES: "false"

  gateway:
    ports: !reset []
    networks:
      - resonance-net
      - caddy
    labels:
      caddy: ${CADDY_GATEWAY_DOMAIN:-}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.encode: gzip

  web:
    ports: !reset []
    networks:
      - resonance-net
      - caddy
    labels:
      caddy: ${CADDY_WEB_DOMAIN:-}
      caddy.reverse_proxy: "{{upstreams 4173}}"
      caddy.encode: gzip
    environment:
      RESONANCE_WEB_API_BASE_URL: ${RESONANCE_WEB_API_BASE_URL:-https://${CADDY_GATEWAY_DOMAIN}}
      RESONANCE_WEB_WS_BASE_URL: ${RESONANCE_WEB_WS_BASE_URL:-wss://${CADDY_GATEWAY_DOMAIN}/ws}

networks:
  caddy:
    external: true
    name: caddy
