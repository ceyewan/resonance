apiVersion: 1
groups:
  - orgId: 1
    name: resonance-local-v1
    folder: Resonance
    interval: 10s
    rules:
      - uid: resonance-service-down
        title: ServiceDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              {
                editorMode: code,
                expr: 'sum(up{job="resonance"} == 0)',
                instant: true,
                intervalMs: 1000,
                maxDataPoints: 43200,
                refId: A,
              }
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                [
                  {
                    evaluator: { params: [0], type: gt },
                    operator: { type: and },
                    query: { params: [C] },
                    reducer: { params: [], type: last },
                    type: query,
                  },
                ]
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30s
        annotations: { summary: "A Resonance service target is down" }
        labels: { severity: critical }
      - uid: resonance-api-high-error-rate
        title: APIHighErrorRate
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              {
                editorMode: code,
                expr: '(sum(rate(gateway_http_requests_total{outcome="error"}[30s])) / clamp_min(sum(rate(gateway_http_requests_total[30s])), 0.001)) and sum(rate(gateway_http_requests_total[30s])) > 0.10',
                instant: true,
                intervalMs: 1000,
                maxDataPoints: 43200,
                refId: A,
              }
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                [
                  {
                    evaluator: { params: [0.2], type: gt },
                    operator: { type: and },
                    query: { params: [C] },
                    reducer: { params: [], type: last },
                    type: query,
                  },
                ]
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations: { summary: "Gateway HTTP 4xx/5xx error rate exceeds 20%" }
        labels: { severity: warning }
      - uid: resonance-outbox-backlog
        title: OutboxBacklog
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              {
                editorMode: code,
                expr: "max(logic_outbox_backlog)",
                instant: true,
                intervalMs: 1000,
                maxDataPoints: 43200,
                refId: A,
              }
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                [
                  {
                    evaluator: { params: [0], type: gt },
                    operator: { type: and },
                    query: { params: [C] },
                    reducer: { params: [], type: last },
                    type: query,
                  },
                ]
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations: { summary: "Outbox relay observed pending messages" }
        labels: { severity: warning }
      - uid: resonance-telemetry-pipeline-down
        title: TelemetryPipelineDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              {
                editorMode: code,
                expr: 'sum(up{job=~"loki|tempo|alloy"} == 0)',
                instant: true,
                intervalMs: 1000,
                maxDataPoints: 43200,
                refId: A,
              }
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                [
                  {
                    evaluator: { params: [0], type: gt },
                    operator: { type: and },
                    query: { params: [C] },
                    reducer: { params: [], type: last },
                    type: query,
                  },
                ]
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30s
        annotations: { summary: "A local telemetry target is down" }
        labels: { severity: critical }
