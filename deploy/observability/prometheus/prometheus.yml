global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: resonance
    static_configs:
      - targets: ["logic:9091", "gateway:9092", "task:9090", "pilot:9093", "pilot-iam-admin:9093"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
