groups:
  - name: resonance-local-v1
    rules:
      - alert: ServiceDown
        expr: up{job="resonance"} == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "Resonance service target is down" }
      - alert: APIHighErrorRate
        expr: |
          (
            sum(rate(gateway_http_requests_total{outcome="error"}[30s]))
            /
            clamp_min(sum(rate(gateway_http_requests_total[30s])), 0.001)
          ) > 0.20
          and sum(rate(gateway_http_requests_total[30s])) > 0.10
        for: 15s
        labels: { severity: warning }
        annotations: { summary: "Gateway HTTP 4xx/5xx error rate exceeds 20%" }
      - alert: OutboxBacklog
        expr: max_over_time(logic_outbox_backlog[1m]) > 0
        for: 10s
        labels: { severity: warning }
        annotations: { summary: "Logic outbox has pending records" }
      - alert: TelemetryPipelineDown
        expr: min(up{job=~"prometheus|loki|tempo|alloy"}) == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "Local telemetry component is down" }
